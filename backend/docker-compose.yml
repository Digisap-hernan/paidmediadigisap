services:
  postgres:
    image: postgres:15-alpine
    container_name: paidmedia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: paidmedia
      POSTGRES_PASSWORD: paidmedia
      POSTGRES_DB: paidmedia
    ports:
      - "5432:5432"
    volumes:
      - paidmedia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paidmedia -d paidmedia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  paidmedia_pgdata:
